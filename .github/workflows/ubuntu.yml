name: Ubuntu-Tailscale

on:
  workflow_dispatch:

jobs:
  ubuntu-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update system
        run: |
          sudo apt update
          sudo apt install -y curl wget

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-${{ github.run_id }}

      - name: Get IP
        run: |
          tailscale ip -4

      - name: Keep alive
        run: |
          while true; do
            echo "running: $(date)"
            sleep 300
          done
