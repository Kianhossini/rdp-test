name: Ubuntu-Cloudflare-3xUI

on:
  workflow_dispatch:

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update packages
        run: sudo apt update && sudo apt install -y curl wget git jq sqlite3

      - name: Install 3x-ui
        run: echo "y" | curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | sudo bash

      - name: Wait and Start x-ui
        run: |
          sleep 10
          sudo systemctl restart x-ui
          sleep 10

      - name: Get Port from DB
        run: |
          PORT=$(sudo sqlite3 /etc/x-ui/x-ui.db "select value from settings where key='webPort';" 2>/dev/null)
          echo "PORT=$PORT" >> $GITHUB_ENV
          echo "X-UI PORT FROM DB: $PORT"

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Quick Tunnel
        run: |
          echo "Starting tunnel on port: $PORT"
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:$PORT > /tmp/cf.log 2>&1 &
          sleep 15
          cat /tmp/cf.log

      - name: Show Info
        run: |
          CF_URL=$(grep -o 'https://.*\.trycloudflare\.com' /tmp/cf.log | head -1)
          WEBPATH=$(sudo sqlite3 /etc/x-ui/x-ui.db "select value from settings where key='webBasePath';" 2>/dev/null)
          USER=$(sudo sqlite3 /etc/x-ui/x-ui.db "select value from settings where key='webAdminUsername';" 2>/dev/null)
          PASS=$(sudo sqlite3 /etc/x-ui/x-ui.db "select value from settings where key='webAdminPassword';" 2>/dev/null)
          echo "=============================="
          echo "PANEL URL : $CF_URL/$WEBPATH"
          echo "USER      : $USER"
          echo "PASS      : $PASS"
          echo "PORT      : $PORT"
          echo "=============================="

      - name: Keep Alive
        run: |
          while true; do
            sleep 300
          done
