name: Ubuntu-Tailscale-3xUI

on:
  workflow_dispatch:

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update packages
        run: sudo apt update && sudo apt install -y curl wget git openssh-server sudo

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-${{ github.run_id }}"

      - name: Enable SSH
        run: |
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Enable Root Login
        run: |
          echo "root:123456" | sudo chpasswd
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Install 3x-ui
        run: echo "y" | curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | sudo bash

      - name: Wait and Start x-ui
        run: |
          sleep 5
          sudo systemctl enable x-ui
          sudo systemctl restart x-ui
          sleep 3

      - name: Show Info
        run: |
          TAILSCALE_IP=$(tailscale ip -4)
          echo "=============================="
          echo "TAILSCALE IP: $TAILSCALE_IP"
          echo "PANEL URL: http://$TAILSCALE_IP:2053/panel"
          echo "DEFAULT USER: admin"
          echo "DEFAULT PASS: admin"
          echo "SSH: ssh root@$TAILSCALE_IP"
          echo "=============================="
          sudo x-ui setting -show 2>/dev/null || true

      - name: Keep Alive
        run: |
          while true; do
            sleep 300
          done
