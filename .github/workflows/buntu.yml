name: Ubuntu-Cloudflare-3xUI

on:
  workflow_dispatch:

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update packages
        run: sudo apt update && sudo apt install -y curl wget git jq sqlite3

      - name: Install 3x-ui
        run: echo "y" | curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | sudo bash

      - name: Set x-ui port to 80
        run: |
          sudo sqlite3 /etc/x-ui/x-ui.db "update settings set value='80' where key='webPort';"
          sudo sqlite3 /etc/x-ui/x-ui.db "update settings set value='/' where key='webBasePath';"
          sleep 3
          sudo systemctl restart x-ui
          sleep 10
          echo "x-ui running on port:"
          ss -tlnp | grep :80

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Quick Tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:80 > /tmp/cf.log 2>&1 &
          sleep 15
          cat /tmp/cf.log

      - name: Show Info
        run: |
          CF_URL=$(grep -o 'https://.*\.trycloudflare\.com' /tmp/cf.log | head -1)
          USER=$(sudo sqlite3 /etc/x-ui/x-ui.db "select value from settings where key='webAdminUsername';")
          PASS=$(sudo sqlite3 /etc/x-ui/x-ui.db "select value from settings where key='webAdminPassword';")
          echo "=============================="
          echo "PANEL URL : $CF_URL/panel"
          echo "CF URL    : $CF_URL"
          echo "USER      : $USER"
          echo "PASS      : $PASS"
          echo "=============================="

      - name: Keep Alive
        run: |
          while true; do
            sleep 300
          done
