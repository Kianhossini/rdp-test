name: Ubuntu-Tailscale-3xUI

on:
  workflow_dispatch:

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update packages
        run: sudo apt update && sudo apt install -y curl wget git openssh-server sudo

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-${{ github.run_id }}"

      - name: Enable SSH
        run: |
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Enable Root Login
        run: |
          echo "root:123456" | sudo chpasswd
          sudo sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Install 3x-ui
        run: echo "y" | curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh | sudo bash

      - name: Wait and Start x-ui
        run: |
          sleep 5
          sudo systemctl enable x-ui
          sudo systemctl restart x-ui
          sleep 5

      - name: Check x-ui Status
        run: |
          echo "======= SERVICE STATUS ======="
          sudo systemctl status x-ui || true
          echo ""
          echo "======= LISTENING PORTS ======="
          ss -tlnp | grep x-ui || true
          echo ""
          echo "======= ALL OPEN PORTS ======="
          ss -tlnp
          echo ""
          echo "======= X-UI SETTINGS ======="
          sudo x-ui setting -show || true
          echo ""
          echo "======= X-UI LOGS ======="
          sudo journalctl -u x-ui -n 30 --no-pager || true

      - name: Show Info
        run: |
          TAILSCALE_IP=$(tailscale ip -4)
          PORT=$(sudo x-ui setting -show 2>/dev/null | grep -i port | head -1 | grep -oP '\d{4,5}' || echo "unknown")
          WEBPATH=$(sudo x-ui setting -show 2>/dev/null | grep -i path | head -1 | awk '{print $NF}' || echo "/panel")
          echo "=============================="
          echo "TAILSCALE IP : $TAILSCALE_IP"
          echo "PANEL PORT   : $PORT"
          echo "PANEL URL    : http://$TAILSCALE_IP:$PORT$WEBPATH"
          echo "DEFAULT USER : admin"
          echo "DEFAULT PASS : admin"
          echo "SSH COMMAND  : ssh root@$TAILSCALE_IP"
          echo "=============================="

      - name: Keep Alive
        run: |
          while true; do
            sleep 300
          done
